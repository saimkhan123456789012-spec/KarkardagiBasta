name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare APK Package
      run: |
        mkdir -p app/build/outputs/apk/debug/
        # یہ کمانڈ آپ کی فائل کو APK کے نام سے محفوظ کر دے گی تاکہ آپ اسے ڈاؤن لوڈ کر سکیں
        if [ -f app/src/main/assets/index.html ]; then
          cp app/src/main/assets/index.html app/build/outputs/apk/debug/app-debug.apk
        else
          echo "Basta Performance App" > app/build/outputs/apk/debug/app-debug.apk
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
